aid: telleroo
name: Telleroo
description: >-
  Telleroo is a UK bulk payments platform that automates supplier and payroll
  payments for businesses, accountants and bookkeepers. It provisions a
  ring-fenced e-money wallet in the customer's name and sends bulk Faster
  Payments 24/7 (including bank holidays), plus international payments in 25+
  currencies over SEPA, ACH and SWIFT. Built-in fraud controls include
  Confirmation of Payee, new/updated payee alerts and multi-level approval
  workflows, and it integrates with accounting and payroll software such as
  Xero, QuickBooks, Employment Hero and Staffology. Telleroo exposes two
  RESTful APIs: a Business API (v1, token auth) for automating outbound
  payments from your own account, and a Partner/Embedded Payments API (v3,
  OAuth 2.0) for building pay runs into your own platform on behalf of client
  companies. Both support idempotent requests, real-time webhooks and a
  dedicated sandbox environment.
