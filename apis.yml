apis:
- name: Telleroo Business API
  description: >-
    RESTful API (v1) to automate outbound payments from your own Telleroo
    account: manage recipients, query accounts and transactions, and create
    bank transfers (to a saved recipient or adhoc). Token authentication via
    the Authorization header; version selected with the
    Accept: application/vnd.telleroo.v1 header. Supports idempotent transfers
    (idempotent_key), pagination and webhooks.
  humanURL: https://docs.telleroo.com/
  baseURL: https://api.telleroo.com
  tags:
  - Payments
  - Bank Transfers
  - Recipients
  properties:
  - type: Documentation
    url: https://docs.telleroo.com/
  - type: APIReference
    url: https://docs.telleroo.com/#introduction
  - type: Authentication
    url: authentication/telleroo-authentication.yml
- name: Telleroo Partner API
  description: >-
    RESTful Embedded Payments API (v3) to build Telleroo into your own
    platform: authorize against client companies over OAuth 2.0
    (authorization code, scope "create"), enumerate companies and accounts,
    and create/submit/manage pay runs on their behalf. Version selected with
    the Accept: application/vnd.telleroo.v3 header. Supports idempotent pay
    runs and webhooks.
  humanURL: https://partner-docs.telleroo.com/
  baseURL: https://api.telleroo.com
